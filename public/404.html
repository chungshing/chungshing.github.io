<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1b1915" />
        <title>Page Not Found | Chung Shing</title>
        <script>
            // /life is a client-side route: send it back to the app instead of showing the 404.
            if (/^\/life\/?$/.test(location.pathname)) {
                sessionStorage.setItem('spa-redirect', '/life');
                location.replace('/');
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Lora:ital@0;1&family=Caveat:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 1.5rem;
                box-sizing: border-box;
                background-color: #1b1915;
                background-image: repeating-linear-gradient(
                    transparent 0 31px,
                    rgba(249, 241, 216, 0.07) 31px 32px
                );
                color: #fcf5df;
                font-family: 'Lora', Georgia, serif;
            }
            h1 {
                margin: 0;
                font-family: 'Caveat', cursive;
                font-weight: 700;
                font-size: clamp(6rem, 22vw, 11rem);
                line-height: 0.9;
                color: #fcf5df;
                transform: rotate(-3deg);
            }
            .note {
                margin: 0.4rem 0 0;
                font-family: 'Caveat', cursive;
                font-weight: 700;
                font-size: 1.8rem;
                color: #f8c24a;
                transform: rotate(-1deg);
            }
            p {
                margin: 1rem 0 2rem;
                max-width: 34ch;
                font-size: 1.05rem;
                line-height: 1.7;
                color: #d6c79f;
            }
            .links {
                display: flex;
                flex-wrap: wrap;
                gap: 0.8rem;
                justify-content: center;
            }
            a {
                font-family: 'Fira Code', ui-monospace, monospace;
                font-size: 0.85rem;
                text-decoration: none;
                padding: 10px 18px;
                border-radius: 8px;
                border: 1px solid #8a7d61;
                background-color: #3d352b;
                color: #fcf5df;
                transition:
                    border-color 0.2s ease,
                    color 0.2s ease;
            }
            a:hover {
                border-color: #f8c24a;
                color: #f8c24a;
            }
            a:focus-visible {
                outline: 3px solid #ef8330;
                outline-offset: 3px;
            }
            @media (prefers-reduced-motion: reduce) {
                a {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <h1>404</h1>
        <span class="note">this page wandered off</span>
        <p>
            It isn’t in this notebook.<br />
            Try the portfolio, or step outside for a bit.
        </p>
        <div class="links">
            <a href="/">back to the portfolio</a>
            <a href="/life/">outside the screen →</a>
        </div>
    </body>
</html>
